name: Build Microsoft Store Package

on:
  push:
    tags:
      - 'v*' # v1.6.5 などのタグプッシュ時に自動実行
  workflow_dispatch: # GitHub Web画面から手動実行可能

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore FocusDimmer2.sln

      - name: Build Store Package (.msixupload)
        run: |
          msbuild FocusDimmer.Package/FocusDimmer.Package.wapproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundlePlatforms="x64" `
            /p:AppxBundle=Always `
            /p:AppxPackageDir="${{ github.workspace }}\AppPackages\" `
            /p:GenerateAppxPackageOnBuild=true

      - name: Upload Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusDimmer-StorePackage
          path: AppPackages/**/*.msixupload
          retention-days: 14

      - name: Create GitHub Release and Attach Package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AppPackages/**/*.msixupload
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
